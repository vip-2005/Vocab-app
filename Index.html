<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vocab Master">
  <title>Vocab Master - 25 Words Per Lesson</title>

  <!-- Dynamic PWA Manifest & Icon Script -->
  <script>
    const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="115" fill="#4f46e5"/><path d="M140 140h232v50H140zm0 95h180v50H140zm0 95h232v50H140z" fill="#ffffff"/><circle cx="380" cy="260" r="45" fill="#fbbf24"/></svg>`;
    const iconUrl = "data:image/svg+xml;base64," + btoa(svgIcon);

    const manifest = {
      name: "Vocab Master Pro",
      short_name: "VocabMaster",
      description: "English Vocabulary Flashcards, Synonyms, Antonyms & Quiz App",
      start_url: "./index.html",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#4f46e5",
      orientation: "portrait",
      icons: [
        { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
        { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);

    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = iconUrl;
    document.head.appendChild(appleIcon);
  </script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --syn-bg: #ecfdf5;
      --syn-text: #059669;
      --ant-bg: #fef2f2;
      --ant-text: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
      user-select: none;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.2);
    }
    .brand { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.3px; }
    .brand span { color: #fde047; }
    #installBtn {
      display: none;
      background: #fde047;
      color: #0f172a;
      border: none;
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Container */
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }

    /* Lesson Selector */
    .lesson-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .lesson-bar::-webkit-scrollbar { display: none; }
    .lesson-chip {
      padding: 10px 18px;
      border-radius: 12px;
      background: white;
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }
    .lesson-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(79,70,229,0.25);
    }

    /* Mode Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #e2e8f0;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .tab-btn {
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* Flashcard 3D */
    .card-scene {
      perspective: 1000px;
      height: 390px;
      margin-bottom: 18px;
    }
    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .flashcard.is-flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      background: var(--card-bg);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-front {
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card-back { transform: rotateY(180deg); overflow-y: auto; }

    .pos-tag {
      background: #eef2ff;
      color: var(--primary);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .main-word { font-size: 2.4rem; font-weight: 900; color: var(--text); margin-bottom: 8px; }
    .hindi-preview { font-size: 1.25rem; color: var(--primary); font-weight: 700; margin-bottom: 18px; }
    .speak-btn {
      background: #f1f5f9;
      border: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tap-hint { font-size: 0.8rem; color: var(--muted); margin-top: 22px; }

    /* Back details */
    .back-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .back-word { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
    .eng-meaning { font-size: 0.98rem; color: #334155; line-height: 1.45; margin-bottom: 14px; }
    .pill-group { margin-bottom: 12px; }
    .pill-title { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { padding: 4px 10px; border-radius: 8px; font-size: 0.83rem; font-weight: 600; }
    .pill.syn { background: var(--syn-bg); color: var(--syn-text); }
    .pill.ant { background: var(--ant-bg); color: var(--ant-text); }
    .example-box {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 10px 12px;
      font-size: 0.9rem;
      font-style: italic;
      color: #334155;
      border-radius: 0 8px 8px 0;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .nav-btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .nav-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .counter-badge { font-weight: 800; font-size: 1rem; color: var(--text); min-width: 70px; text-align: center; }

    /* List View */
    .search-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }
    .word-list-item {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .w-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .w-title { font-size: 1.15rem; font-weight: 800; color: var(--text); }
    .w-hindi { color: var(--primary); font-weight: 700; font-size: 0.95rem; }

    /* Quiz View */
    .quiz-card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      border: 1px solid var(--border);
    }
    .quiz-q { font-size: 1.15rem; font-weight: 800; margin: 12px 0 18px; }
    .quiz-opt {
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .quiz-opt.correct { background: #ecfdf5; border-color: #10b981; color: #065f46; }
    .quiz-opt.wrong { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">Vocab<span>Master</span></div>
    <button id="installBtn">📲 Install App</button>
  </header>

  <div class="container">
    <!-- Lesson Selection -->
    <div class="lesson-bar" id="lessonBar"></div>

    <!-- Mode Switcher -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchMode('flashcard', this)">Flashcards</button>
      <button class="tab-btn" onclick="switchMode('list', this)">25 Words List</button>
      <button class="tab-btn" onclick="switchMode('quiz', this)">Practice Quiz</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcardView">
      <div class="card-scene">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
          <!-- Front -->
          <div class="card-face card-front">
            <span class="pos-tag" id="fcPos">Adjective</span>
            <div class="main-word" id="fcWord">Word</div>
            <div class="hindi-preview" id="fcHindi">अर्थ</div>
            <button class="speak-btn" onclick="speakWord(event)">🔊 Pronounce</button>
            <div class="tap-hint">👆 Tap card to see Synonyms & Antonyms</div>
          </div>
          <!-- Back -->
          <div class="card-face card-back">
            <div>
              <div class="back-header">
                <span class="back-word" id="fcBackWord">Word</span>
                <span id="fcBackHindi" style="font-weight:700;">अर्थ</span>
              </div>
              <p class="eng-meaning" id="fcEng"></p>
              <div class="pill-group">
                <div class="pill-title">Synonyms (समानार्थी)</div>
                <div class="pills" id="fcSyn"></div>
              </div>
              <div class="pill-group">
                <div class="pill-title">Antonyms (विलोम)</div>
                <div class="pills" id="fcAnt"></div>
              </div>
            </div>
            <div class="example-box" id="fcEx"></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="nav-btn" id="prevBtn" onclick="changeCard(-1)">⬅ Previous</button>
        <div class="counter-badge" id="cardCounter">1 / 25</div>
        <button class="nav-btn" id="nextBtn" onclick="changeCard(1)">Next ➡</button>
      </div>
    </div>

    <!-- LIST VIEW -->
    <div id="listView" class="hidden">
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search word or Hindi meaning..." oninput="renderList()">
      <div id="wordListContainer"></div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="quizView" class="hidden">
      <div class="quiz-card">
        <div style="display:flex; justify-content:space-between; color:var(--muted); font-size:0.85rem; font-weight:700;">
          <span id="quizProgress">Question 1/10</span>
          <span id="quizScore">Score: 0</span>
        </div>
        <div class="quiz-q" id="quizQuestion">Loading...</div>
        <div id="quizOptions"></div>
        <button class="nav-btn" id="nextQuizBtn" style="margin-top:10px; width:100%; display:none;" onclick="nextQuizQuestion()">Next Question ➡</button>
      </div>
    </div>
  </div>
